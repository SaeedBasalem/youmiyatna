<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a1030" />
<title>يومياتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sky">
  <div class="grad"></div>
  <div class="glowmoon"></div>
  <canvas id="stars"></canvas>
</div>

<!-- LOCK / COVER -->
<div class="wrap" id="lock">
  <div class="cover">
    <div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيم</div>
    <div class="brand">يومياتنا</div>
    <div class="sub">صفحاتٌ بيننا، نكتبها معًا،<br>ونمضي بها إلى رضا الله.</div>
    <div class="field">
      <input id="passInput" type="password" inputmode="numeric" placeholder="كلمة الفتح…" autocomplete="off" />
    </div>
    <button class="btn gold" id="unlockBtn">افتحي الكتاب</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<!-- BOOK -->
<div class="wrap hidden" id="bookWrap">
  <div id="book"></div>
  <div class="nav">
    <button id="prevBtn" title="السابق">›</button>
    <button id="nextBtn" title="التالي">‹</button>
  </div>
</div>

<!-- floating tools -->
<div class="tools hidden" id="tools">
  <button class="fab" id="addFab" title="أضف لحظة">＋</button>
  <button class="fab mini" id="soundBtn" title="الصوت">🔊</button>
  <button class="fab mini" id="exportBtn" title="حفظ نسخة JSON">⬇</button>
  <button class="fab mini" id="importBtn" title="استيراد JSON">⬆</button>
</div>

<div id="spark"></div>
<div class="loader hidden" id="loader"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
