<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a1030" />
<title>يومياتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eaf0ff;
  --ink-soft:#b9c6f0;
  --gold:#e7c873;
  --him:#8fb7ff;
  --her:#f3a6c9;
  --hue:225;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Amiri',serif;
  color:var(--ink);
  background:#070b22;
  overflow:hidden;
  position:fixed;inset:0;
}
/* ---------- shifting night sky ---------- */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden}
#sky .grad{
  position:absolute;inset:-20%;
  background:
    radial-gradient(60% 45% at 20% 15%, hsla(215,70%,30%,.55), transparent 60%),
    radial-gradient(55% 50% at 85% 20%, hsla(255,65%,32%,.5), transparent 60%),
    radial-gradient(70% 60% at 50% 100%, hsla(200,75%,28%,.55), transparent 65%),
    linear-gradient(160deg,#070b22 0%,#0a1030 45%,#0b1440 100%);
  animation:hue 26s ease-in-out infinite alternate;
  filter:saturate(1.15);
}
@keyframes hue{
  0%{filter:hue-rotate(0deg) saturate(1.1)}
  50%{filter:hue-rotate(24deg) saturate(1.25)}
  100%{filter:hue-rotate(-18deg) saturate(1.15)}
}
canvas#stars{position:absolute;inset:0;width:100%;height:100%}
.glowmoon{
  position:absolute;top:8%;left:12%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fff8e6,#e7c873 55%,transparent 72%);
  filter:blur(2px);opacity:.85;box-shadow:0 0 70px 20px rgba(231,200,115,.25);
  animation:float 14s ease-in-out infinite alternate;
}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(18px)}}

/* ---------- generic ---------- */
.wrap{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:18px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.center{text-align:center}

/* ---------- lock / cover ---------- */
#lock .cover{
  width:min(420px,92vw);padding:44px 30px;border-radius:20px;text-align:center;
  background:linear-gradient(160deg,rgba(18,26,64,.75),rgba(10,16,44,.85));
  border:1px solid rgba(231,200,115,.35);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 40px rgba(143,183,255,.08);
  backdrop-filter:blur(6px);
}
.brand{font-family:'Aref Ruqaa',serif;font-size:52px;color:var(--gold);
  text-shadow:0 0 24px rgba(231,200,115,.45);margin:6px 0 2px;letter-spacing:1px}
.bism{font-family:'Reem Kufi',sans-serif;color:var(--ink-soft);font-size:15px;margin-bottom:26px;opacity:.9}
.sub{color:var(--ink-soft);font-size:17px;margin-bottom:22px;line-height:1.9}
.field{position:relative;margin:14px 0}
input[type=text],input[type=password],textarea,input[type=date],select{
  width:100%;padding:14px 16px;border-radius:12px;font-family:'Amiri',serif;font-size:17px;
  background:rgba(255,255,255,.06);border:1px solid rgba(143,183,255,.28);color:var(--ink);
  outline:none;transition:.2s;
}
input::placeholder,textarea::placeholder{color:rgba(185,198,240,.55)}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(255,255,255,.09)}
.btn{
  display:inline-block;width:100%;padding:14px;border-radius:12px;font-size:18px;
  background:linear-gradient(120deg,#2a3a86,#43307a);color:#fff;
  border:1px solid rgba(231,200,115,.4);box-shadow:0 10px 30px rgba(43,58,134,.4);
  transition:transform .15s,box-shadow .2s;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(120deg,#b48a2e,#e7c873);color:#20160a;font-weight:700}
.err{color:#ff9ab0;min-height:20px;font-size:14px;margin-top:8px}

/* ---------- book ---------- */
#book{width:min(560px,94vw);height:min(760px,86vh);position:relative;perspective:2200px}
.page{
  position:absolute;inset:0;border-radius:16px;padding:34px 30px;overflow-y:auto;
  background:linear-gradient(158deg,rgba(20,28,66,.92),rgba(11,18,48,.96));
  border:1px solid rgba(143,183,255,.22);
  box-shadow:0 26px 70px rgba(0,0,0,.55),inset 0 0 60px rgba(90,120,220,.06);
  backface-visibility:hidden;transform-origin:right center;
  transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s;
  scrollbar-width:thin;scrollbar-color:rgba(143,183,255,.4) transparent;
}
.page::-webkit-scrollbar{width:6px}
.page::-webkit-scrollbar-thumb{background:rgba(143,183,255,.35);border-radius:6px}
.page.turning{transform:rotateY(-165deg);opacity:.15}
.page .spine{position:absolute;top:0;bottom:0;right:0;width:20px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent);border-radius:0 16px 16px 0}
.page-num{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--ink-soft);opacity:.5;font-size:13px}

.ded-title{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:30px;text-align:center;margin:6px 0 20px;text-shadow:0 0 18px rgba(231,200,115,.4)}
.ded-body{font-size:20px;line-height:2.35;text-align:justify;color:#f2f5ff}
.ornament{text-align:center;color:var(--gold);font-size:22px;margin:16px 0;opacity:.8;letter-spacing:6px}

.reply-note{color:var(--ink-soft);font-size:15px;text-align:center;margin-bottom:14px}
.reply-display{font-size:20px;line-height:2.2;text-align:justify;white-space:pre-wrap;color:#ffeaf4}

/* moment page */
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;font-family:'Reem Kufi',sans-serif;font-size:14px;font-weight:500}
.badge.him{background:rgba(143,183,255,.16);border:1px solid var(--him);color:var(--him)}
.badge.her{background:rgba(243,166,201,.16);border:1px solid var(--her);color:var(--her)}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.m-date{color:var(--ink-soft);font-size:15px;opacity:.85}
.m-mood{font-size:34px;text-align:center;margin:6px 0 14px;filter:drop-shadow(0 0 10px rgba(231,200,115,.35))}
.m-photo{width:100%;border-radius:14px;margin:6px 0 18px;border:1px solid rgba(231,200,115,.25);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.m-body{font-size:21px;line-height:2.3;text-align:justify;white-space:pre-wrap;color:#f2f5ff}
.m-del{position:absolute;bottom:12px;right:16px;color:rgba(255,150,170,.6);font-size:13px}

/* nav */
.nav{position:absolute;bottom:-4px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:5;transform:translateY(140%)}
.nav button{width:52px;height:52px;border-radius:50%;font-size:22px;color:var(--gold);
  background:rgba(15,22,58,.85);border:1px solid rgba(231,200,115,.4);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.nav button:active{transform:scale(.94)}
.nav button:disabled{opacity:.3}
.fab{position:fixed;bottom:22px;left:22px;z-index:20;width:60px;height:60px;border-radius:50%;font-size:30px;color:#20160a;
  background:linear-gradient(120deg,#b48a2e,#e7c873);border:1px solid #fff2cf;
  box-shadow:0 12px 34px rgba(231,200,115,.4);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.93)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(4,7,20,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(460px,94vw);max-height:90vh;overflow-y:auto;border-radius:20px;padding:26px;
  background:linear-gradient(160deg,rgba(20,28,66,.97),rgba(11,18,48,.98));border:1px solid rgba(231,200,115,.35);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-family:'Aref Ruqaa',serif;color:var(--gold);text-align:center;margin:0 0 18px;font-size:26px}
.row{display:flex;gap:10px;margin:12px 0}
.who{flex:1;padding:12px;border-radius:12px;text-align:center;font-family:'Reem Kufi',sans-serif;border:1px solid rgba(143,183,255,.25);background:rgba(255,255,255,.05);transition:.2s}
.who.sel-him{border-color:var(--him);background:rgba(143,183,255,.18);color:var(--him)}
.who.sel-her{border-color:var(--her);background:rgba(243,166,201,.18);color:var(--her)}
.moods{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.mood{padding:8px 12px;border-radius:999px;font-size:15px;border:1px solid rgba(143,183,255,.25);background:rgba(255,255,255,.05)}
.mood.sel{border-color:var(--gold);background:rgba(231,200,115,.18);color:var(--gold)}
label.lbl{display:block;color:var(--ink-soft);font-size:14px;margin:14px 0 6px}
.photo-prev{width:100%;border-radius:12px;margin-top:10px;display:none}
.loader{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,7,20,.6)}
.spinner{width:44px;height:44px;border:3px solid rgba(231,200,115,.25);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:80;background:rgba(15,22,58,.95);
  border:1px solid rgba(231,200,115,.4);color:var(--ink);padding:12px 22px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="sky">
  <div class="grad"></div>
  <div class="glowmoon"></div>
  <canvas id="stars"></canvas>
</div>

<!-- LOCK / COVER -->
<div class="wrap" id="lock">
  <div class="cover">
    <div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيم</div>
    <div class="brand">يومياتنا</div>
    <div class="sub">صفحاتٌ بيننا، نكتبها معًا،<br>ونمضي بها إلى رضا الله.</div>
    <div class="field">
      <input id="passInput" type="password" placeholder="كلمة الفتح…" autocomplete="off" />
    </div>
    <button class="btn gold" id="unlockBtn">افتحي الكتاب</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<!-- BOOK -->
<div class="wrap hidden" id="bookWrap">
  <div id="book"></div>
  <div class="nav">
    <button id="prevBtn" title="السابق">›</button>
    <button id="nextBtn" title="التالي">‹</button>
  </div>
</div>
<button class="fab hidden" id="addFab" title="أضف لحظة">＋</button>

<div class="loader hidden" id="loader"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://vfyzedlyveukjaukcekq.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmeXplZGx5dmV1a2phdWtjZWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NDU5MjksImV4cCI6MjA4ODAyMTkyOX0.ojqZrTULclfbd_PrU0VCP7E0ylJGLskdi53BUEwiC-w";
const FN = SUPABASE_URL + "/functions/v1/journal";
const TKEY = "youmiyatna_token";

async function api(action, extra={}){
  const token = localStorage.getItem(TKEY) || undefined;
  const res = await fetch(FN,{
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":ANON, "Authorization":"Bearer "+ANON },
    body:JSON.stringify({action, token, ...extra})
  });
  let data={}; try{ data=await res.json(); }catch{}
  return {ok:res.ok, status:res.status, data};
}

const $ = s=>document.querySelector(s);
const loader = $("#loader");
function showLoader(v){ loader.classList.toggle("hidden",!v); }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- starfield ---------- */
(function(){
  const c=$("#stars"), x=c.getContext("2d"); let stars=[],w,h;
  function size(){ w=c.width=innerWidth; h=c.height=innerHeight;
    const n=Math.min(160,Math.floor(w*h/9000)); stars=[];
    for(let i=0;i<n;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,t:Math.random()*Math.PI*2,s:Math.random()*.02+.005});
  }
  function draw(){ x.clearRect(0,0,w,h);
    for(const st of stars){ st.t+=st.s; const a=.4+Math.sin(st.t)*.4;
      x.beginPath(); x.arc(st.x,st.y,st.r,0,7); x.fillStyle="rgba(220,232,255,"+a+")"; x.fill();
      if(st.r>1.2){ x.beginPath(); x.arc(st.x,st.y,st.r*2.4,0,7); x.fillStyle="rgba(160,190,255,"+a*.12+")"; x.fill(); }
    }
    requestAnimationFrame(draw);
  }
  addEventListener("resize",size); size(); draw();
})();

/* ---------- data ---------- */
let STATE={ dedication:"", reply:"", entries:[] };
let pages=[]; let idx=0;
const MOODS=[["فرح","😊"],["حبّ","❤️"],["شوق","🌙"],["سكينة","☁️"],["امتنان","🤲"],["ضحك","😄"],["حنين","🕊️"],["أمل","✨"]];
function moodEmoji(m){ const f=MOODS.find(x=>x[0]===m); return f?f[1]:""; }
function fmtDate(d){ try{ return new Date(d+"T00:00:00").toLocaleDateString("ar",{year:"numeric",month:"long",day:"numeric"}); }catch{ return d; } }

/* ---------- render ---------- */
function buildPages(){
  pages=[];
  // Page 1: dedication
  pages.push(`<div class="page-inner">
    <div class="ded-title">الإهداء</div>
    <div class="ded-body">${esc(STATE.dedication).replace(/—/g,'<br><span style="color:var(--gold)">—</span>')}</div>
    <div class="ornament">۞ ✦ ۞</div>
  </div>`);
  // Page 2: her reply
  const hasReply = STATE.reply && STATE.reply.trim();
  pages.push(`<div class="page-inner">
    <div class="ded-title">ردُّها</div>
    <div class="reply-note">مساحةٌ لكِ يا ياسمين — اكتبي ما في قلبكِ.</div>
    ${ hasReply
        ? `<div class="reply-display">${esc(STATE.reply)}</div><div class="ornament">✦</div><button class="btn" id="editReply" style="margin-top:14px">تعديل الرد</button>`
        : `<textarea id="replyBox" rows="7" placeholder="ابدئي هنا…"></textarea><button class="btn gold" id="saveReply" style="margin-top:12px">احفظي ردّكِ</button>` }
  </div>`);
  // Moment pages
  for(const e of STATE.entries){
    const who = e.author==="her" ? {c:"her",n:"ياسمين"} : {c:"him",n:"سعيد"};
    pages.push(`<div class="page-inner">
      <div class="m-head">
        <span class="badge ${who.c}">✍ ${who.n}</span>
        <span class="m-date">${fmtDate(e.entry_date)}</span>
      </div>
      ${e.mood?`<div class="m-mood">${moodEmoji(e.mood)}</div>`:""}
      ${e.photo_url?`<img class="m-photo" src="${esc(e.photo_url)}" alt="" loading="lazy">`:""}
      <div class="m-body">${esc(e.body)}</div>
      <button class="m-del" data-id="${e.id}">حذف</button>
    </div>`);
  }
  if(idx>=pages.length) idx=pages.length-1;
  if(idx<0) idx=0;
  renderPage();
}

function renderPage(){
  const book=$("#book");
  const total=pages.length;
  book.innerHTML = `<div class="page" id="pg">
      <div class="spine"></div>
      ${pages[idx]}
      <div class="page-num">${idx+1} / ${total}</div>
    </div>`;
  $("#prevBtn").disabled = idx===0;
  $("#nextBtn").disabled = idx===total-1;
  // wire per-page controls
  const sr=$("#saveReply"); if(sr) sr.onclick=saveReply;
  const er=$("#editReply"); if(er) er.onclick=()=>{ STATE.reply=""; buildPages(); };
  book.querySelectorAll(".m-del").forEach(b=>b.onclick=()=>delEntry(b.dataset.id));
}

function turn(dir){
  const pg=$("#pg"); if(!pg) return;
  const total=pages.length;
  const ni=idx+dir;
  if(ni<0||ni>=total) return;
  pg.classList.add("turning");
  setTimeout(()=>{ idx=ni; renderPage(); },330);
}

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- actions ---------- */
async function saveReply(){
  const v=$("#replyBox").value.trim();
  if(!v){ toast("اكتبي شيئًا أولًا"); return; }
  showLoader(true);
  const r=await api("set_dedication",{key:"reply",value:v});
  showLoader(false);
  if(r.ok){ STATE.reply=v; buildPages(); toast("حُفِظ ردّكِ 🌙"); }
  else toast("تعذّر الحفظ");
}
async function delEntry(id){
  if(!confirm("حذف هذه اللحظة؟")) return;
  showLoader(true);
  const r=await api("delete",{id});
  showLoader(false);
  if(r.ok){ STATE.entries=STATE.entries.filter(e=>e.id!==id); if(idx>0)idx--; buildPages(); toast("حُذِفت"); }
  else toast("تعذّر الحذف");
}

async function loadBook(){
  showLoader(true);
  const r=await api("get");
  showLoader(false);
  if(r.status===401){ openLock(); return false; }
  if(!r.ok){ toast("تعذّر تحميل اليوميات"); return false; }
  STATE.dedication=r.data.dedication||""; STATE.reply=r.data.reply||""; STATE.entries=r.data.entries||[];
  buildPages();
  return true;
}

/* ---------- gate ---------- */
function openBook(){ $("#lock").classList.add("hidden"); $("#bookWrap").classList.remove("hidden"); $("#addFab").classList.remove("hidden"); }
function openLock(){ localStorage.removeItem(TKEY); $("#bookWrap").classList.add("hidden"); $("#addFab").classList.add("hidden"); $("#lock").classList.remove("hidden"); }

async function unlock(){
  const pass=$("#passInput").value.trim();
  const err=$("#lockErr"); err.textContent="";
  if(!pass){ err.textContent="اكتبي كلمة الفتح"; return; }
  showLoader(true);
  const r=await api("unlock",{pass});
  showLoader(false);
  if(r.ok && r.data.token){
    localStorage.setItem(TKEY,r.data.token);
    openBook();
    await loadBook();
  } else if(r.status===401){ err.textContent="كلمة الفتح غير صحيحة"; }
  else { err.textContent="حدث خطأ، حاولي مجددًا"; }
}
$("#unlockBtn").onclick=unlock;
$("#passInput").addEventListener("keydown",e=>{ if(e.key==="Enter") unlock(); });

/* ---------- nav ---------- */
$("#prevBtn").onclick=()=>turn(-1);   // toward the beginning
$("#nextBtn").onclick=()=>turn(1);    // toward newer pages
// swipe (RTL aware)
let sx=0;
document.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{
  if($("#bookWrap").classList.contains("hidden")) return;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)<55) return;
  if(dx<0) turn(-1); else turn(1); // swipe left -> previous (RTL)
});
document.addEventListener("keydown",e=>{
  if($("#bookWrap").classList.contains("hidden")) return;
  if(e.key==="ArrowLeft") turn(1);
  if(e.key==="ArrowRight") turn(-1);
});

/* ---------- add moment modal ---------- */
let draft={author:"him",mood:"",photo:null};
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function openAdd(){
  draft={author:"him",mood:"",photo:null};
  const moodsHtml=MOODS.map(m=>`<span class="mood" data-m="${m[0]}">${m[1]} ${m[0]}</span>`).join("");
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="addBg";
  bg.innerHTML=`<div class="modal">
    <h3>لحظةٌ جديدة</h3>
    <div class="row">
      <div class="who sel-him" data-who="him">✍ سعيد</div>
      <div class="who" data-who="her">✍ ياسمين</div>
    </div>
    <label class="lbl">ماذا حدث؟</label>
    <textarea id="mBody" rows="5" placeholder="اكتب/اكتبي اللحظة…"></textarea>
    <label class="lbl">الحالة</label>
    <div class="moods" id="mMoods">${moodsHtml}</div>
    <label class="lbl">التاريخ</label>
    <input type="date" id="mDate" value="${todayStr()}">
    <label class="lbl">صورة (اختياري)</label>
    <input type="file" id="mPhoto" accept="image/*">
    <img class="photo-prev" id="mPrev">
    <div class="row" style="margin-top:20px">
      <button class="btn" id="mCancel" style="background:rgba(255,255,255,.06)">إلغاء</button>
      <button class="btn gold" id="mSave">أضِف</button>
    </div>
    <div class="err" id="mErr"></div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelectorAll(".who").forEach(el=>el.onclick=()=>{
    draft.author=el.dataset.who;
    bg.querySelectorAll(".who").forEach(w=>w.className="who");
    el.classList.add(draft.author==="him"?"sel-him":"sel-her");
  });
  bg.querySelectorAll(".mood").forEach(el=>el.onclick=()=>{
    const was=el.classList.contains("sel");
    bg.querySelectorAll(".mood").forEach(m=>m.classList.remove("sel"));
    if(!was){ el.classList.add("sel"); draft.mood=el.dataset.m; } else draft.mood="";
  });
  bg.querySelector("#mPhoto").onchange=ev=>{
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ draft.photo=rd.result; const p=bg.querySelector("#mPrev"); p.src=rd.result; p.style.display="block"; }; rd.readAsDataURL(f);
  };
  bg.querySelector("#mCancel").onclick=()=>bg.remove();
  bg.addEventListener("click",e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector("#mSave").onclick=()=>saveMoment(bg);
}
async function saveMoment(bg){
  const body=bg.querySelector("#mBody").value.trim();
  const date=bg.querySelector("#mDate").value||todayStr();
  const err=bg.querySelector("#mErr");
  if(!body && !draft.photo){ err.textContent="اكتب لحظة أو أضِف صورة"; return; }
  showLoader(true);
  const r=await api("add",{author:draft.author,body,mood:draft.mood||null,entry_date:date,photo:draft.photo||null});
  showLoader(false);
  if(r.ok && r.data.entry){
    STATE.entries.push(r.data.entry);
    bg.remove();
    idx=pages.length; // jump to the new (last) page
    buildPages();
    toast("أُضيفت لحظتكما 🌙");
  } else { err.textContent = r.data.detail || "تعذّر الحفظ"; }
}
$("#addFab").onclick=openAdd;

/* ---------- boot ---------- */
(async function(){
  if(localStorage.getItem(TKEY)){
    openBook();
    const ok=await loadBook();
    if(ok) return;
  }
  openLock();
})();
</script>
